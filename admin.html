<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W.D物料後台</title><style>
:root{--black:#0a0a0a;--ink:#181818;--gray:#6b6b6b;--line:#d8d8d8;--paper:#fff;--soft:#f2f2f2;--danger:#9c1c1c}
*{box-sizing:border-box}body{margin:0;background:#ededed;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;letter-spacing:.02em}
.brand{background:#000;color:#fff;text-align:center;padding:20px 14px 17px;border-bottom:1px solid #333}.brand img{width:210px;max-width:64vw;display:block;margin:0 auto 9px}.brand .subtitle{font-size:.78rem;letter-spacing:.28em;color:#cfcfcf}
.shell{max-width:1120px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d7d7d7;border-radius:4px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000a}
h1,h2,h3{margin-top:0;letter-spacing:.08em}.input,select,textarea{width:100%;padding:12px;border:1px solid #aaa;border-radius:2px;background:#fff;font-size:16px;margin:6px 0 10px;color:#111}
button{border:1px solid #111;background:#111;color:#fff;padding:11px 15px;border-radius:2px;font-weight:700;cursor:pointer;letter-spacing:.04em}button.secondary{background:#fff;color:#111}button.danger{background:#fff;color:var(--danger);border-color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.tabs{display:flex;gap:2px;position:sticky;top:0;z-index:30;background:#ededed;padding:8px 0}.tabs button{flex:1;background:#d5d5d5;color:#222;border-color:#d5d5d5}.tabs button.active{background:#111;color:#fff;border-color:#111}
.notice{padding:11px 13px;background:#fff;border-left:5px solid #111;margin-bottom:13px}.muted{color:#666;font-size:.86rem}.hidden{display:none!important}
.search{position:sticky;top:57px;z-index:20;background:#ededed;padding:8px 0}.search .card{margin:0}
.department{background:#fff;border:1px solid #bbb;margin-bottom:12px}.department>summary{list-style:none;cursor:pointer;background:#111;color:#fff;padding:15px;font-weight:800;display:flex;justify-content:space-between}.department>summary::-webkit-details-marker{display:none}.department>summary:after{content:'＋'}.department[open]>summary:after{content:'−'}
.series{border-top:1px solid #bbb}.series>summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:800;background:#e4e4e4}.series>summary::-webkit-details-marker{display:none}.series-body{padding:10px;background:#f7f7f7}.category-title{font-weight:800;padding:9px 4px;border-bottom:1px solid #aaa;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.item{background:#fff;border:1px solid #c8c8c8;padding:10px;min-height:114px}.item.selected{border:2px solid #111}.item-name{font-weight:800;word-break:break-word}.item-meta{font-size:.78rem;color:#666;margin-top:4px}.item-price{font-weight:700;margin-top:4px}.controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}.controls button{width:31px;height:31px;padding:0;border-radius:50%}.qty{font-weight:900;min-width:24px;text-align:center}
.selected-panel{border:2px solid #111}.selected-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.selected-item{border:1px solid #aaa;padding:10px;background:#fafafa}.money{font-variant-numeric:tabular-nums;font-weight:800}.totalbar{position:fixed;bottom:0;left:0;right:0;background:#000;color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;z-index:40;box-shadow:0 -2px 10px #0004}.totalbar button{background:#fff;color:#000;border-color:#fff}.spacer{height:92px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#111;color:#fff;padding:15px}.kpi small{display:block;color:#bbb}.kpi strong{display:block;font-size:1.35rem;margin-top:5px}.order-block{border-top:1px solid #ccc;padding:13px 0}.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted #bbb;padding:6px 0}.right{text-align:right}.badge{display:inline-block;background:#111;color:#fff;padding:2px 7px;font-size:.74rem}.price-warning{color:#8a5b00}.custom-row{border-top:1px solid #ccc;padding:10px 0}
@media(max-width:600px){.shell{padding:10px}.kpis{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.item{min-height:124px}.brand img{width:175px}}
</style><style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:transparent}html.chatgptOled.dark,html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}html.transparentSkybridgeBackground,html.transparentSkybridgeBackground.dark{background-color:transparent}html.androidSkybridge,html.androidSkybridge body,html.androidSkybridge *{-webkit-tap-highlight-color:rgba(255,255,255,0)}html.androidSkybridge *::selection,html.androidSkybridge *::-moz-selection{background:#fff0;color:inherit}</style></head><body>

  shopSearchResults.classList.remove('hidden');

  shopSearchGrid.innerHTML=matches.length?matches.map(shopItem).join(''):'<div class="muted">查無符合商品</div>';
  shopCatalog.classList.add('hidden');
 }else{
  shopSearchResults.classList.add('hidden');
  shopSearchGrid.innerHTML='';
  shopCatalog.classList.remove('hidden');
  if(force||!shopCatalogBuilt){const g={};SHOP_PRODUCTS.forEach(p=>{g[p.mainCategory]??={};const sn=p.vendor+'｜'+p.series;g[p.mainCategory][sn]??=[];g[p.mainCategory][sn].push(p)});shopCatalog.innerHTML=Object.entries(g).map(([cat,series],i)=>`<details class="department" ${i===0?'open':''}><summary>${esc(cat)}</summary>${Object.entries(series).map(([sn,items])=>`<details class="series"><summary>${esc(sn)}</summary><div class="series-body"><div class="grid">${items.map(shopItem).join('')}</div></div></details>`).join('')}</details>`).join('')||'<section class="card">查無商品</section>';shopCatalogBuilt=true}
 }
}
function addShopCustom(){const vendor=sv.value.trim(),name=sn.value.trim(),spec=ss.value.trim(),qty=Number(sq.value),price=Number(sp.value)||0;if(!vendor||!name||qty<=0)return alert('請填寫廠商、品名與數量');shopCustom.push({id:'SC'+Date.now(),vendor,name,spec,qty,price});sv.value=sn.value=ss.value=sp.value='';sq.value=1;renderShopSelected()}

function currentShopItems(){const ids=new Set([...Object.keys(shopCart),...Object.keys(shopSentItems).filter(k=>shopMap[k])]),fixed=[...ids].map(id=>{const p=shopMap[id]||shopSentItems[id];return {productId:id,vendor:p.vendor,name:p.name,spec:p.spec,qty:(shopSentQty[id]||0)+qty(id),price:Number(p.price)||0}}).filter(x=>x.qty>0);return fixed.concat(shopCustom.map(x=>({productId:x.id,vendor:x.vendor,name:x.name,spec:x.spec,qty:(shopSentQty[shopItemKey(x)]||0)+Number(x.qty||0),price:x.price})).filter(x=>x.qty>0))}
function renderDesignerBreakdown(d){
 const entries=Object.entries(d.designers||{});
 if(!entries.length){designerList.innerHTML='本月尚無設計師貨單';return}

  const items=(raw.items||[]).map(latestSummaryItem),sentQty={};

   ...b,batchIndex:batchIndex+1,
   items:(b.items||[]).filter(x=>String(x.owner||'').trim().toLowerCase()===String(name||'').trim().toLowerCase()).map(x=>latestSummaryItem({...x,vendor:x.vendor||b.vendor}))
  })).filter(b=>b.items.length);

function renderVendorPendingBreakdown(d){

 vendorStats.innerHTML=vendorRows.map(([vendor,items])=>{

async function loadAll(){const key=adminKey.value,month=monthInput.value;if(!key)return;try{const d=await jsonp({action:'summary',adminKey:key,month});if(!d.ok)throw new Error(d.message);summaryData=d;status.textContent=d.locked?'目前已截止（'+d.lockMode+'）':'目前開放中（'+d.lockMode+'）';renderSummary(d);renderDesignerBreakdown(d);renderVendorPendingBreakdown(d);await loadShopOrder()}catch(e){alert(e.message)}}
async function loadShopOrder(){const d=await jsonp({action:'shopOrder',adminKey:adminKey.value,month:monthInput.value});if(!d.ok)throw new Error(d.message);shopCart={};shopCustom=[];shopSentQty={};shopSentItems={};(summaryData?.sentBatches||[]).forEach(b=>(b.items||[]).filter(x=>String(x.owner)==='W.D 店用').forEach(x=>{const k=shopItemKey(x);shopSentQty[k]=(shopSentQty[k]||0)+(Number(x.qty)||0);shopSentItems[k]=x}));(d.items||[]).forEach(x=>{const p=SHOP_PRODUCTS.find(p=>p.id===x.productId)||SHOP_PRODUCTS.find(p=>p.vendor===x.vendor&&p.name===x.name&&String(p.spec||'')===String(x.spec||'')),sent=shopSentQty[shopItemKey(x)]||0,pending=Math.max(0,Number(x.qty||0)-sent);if(p){if(pending)shopCart[p.id]=pending}else shopCustom.push({id:x.productId||'SC'+Math.random(),vendor:x.vendor,name:x.name,spec:x.spec||'',qty:pending,price:Number(x.price)||0})});Object.entries(shopSentItems).forEach(([k,x])=>{if(!shopMap[k]&&!shopCustom.some(c=>shopItemKey(c)===k))shopCustom.push({id:x.productId||'SC'+Math.random(),vendor:x.vendor,name:x.name,spec:x.spec||'',qty:0,price:Number(x.price)||0})});renderShopCatalog(true);renderShopSelected()}
function latestSummaryItem(x){let y={...x,qty:Number(x.qty)||0,price:Number(x.price)||0};const p=shopMap[y.productId];if(p)y={...y,vendor:p.vendor,name:p.name,spec:p.spec,price:Number(p.price)||0};const fiole=/fio/i.test(String(y.vendor||''));if(fiole&&(/^H1\s*一劑/.test(y.name||'')||y.productId==='FIOLE-0010'))y.name='翡翠冷燙 H1 一劑';if(fiole&&(/^N1\s*一劑/.test(y.name||'')||y.productId==='FIOLE-0011'))y.name='翡翠冷燙 N1 一劑';if(fiole&&y.productId==='FIOLE-0012')y.name='翡翠冷燙 10% 二劑（溴酸鈉）';if(fiole&&String(y.spec||'').toLowerCase()==='120g'&&Number(y.price)===188)y.price=175;if(['FIOLE-0047','FIOLE-0048'].includes(y.productId))y.price=630;y.amount=y.qty*y.price;return y}
function latestVendorItems(o,vendor){const merged={};Object.values(o.items||{}).map(x=>latestSummaryItem({...x,vendor:x.vendor||vendor})).forEach(x=>{const k=[x.name,x.spec,x.price].join('|');if(!merged[k])merged[k]={...x,qty:0,amount:0};merged[k].qty+=x.qty;merged[k].amount+=x.amount});return Object.values(merged)}
function sentKey(owner,x){return [owner,x.vendor||'',x.productId||'',x.name||'',x.spec||''].join('|')}
function pendingByVendor(d){const sent={};(d.sentBatches||[]).forEach(b=>(b.items||[]).forEach(raw=>{const x=latestSummaryItem({...raw,vendor:raw.vendor||b.vendor}),k=sentKey(raw.owner,x);sent[k]=(sent[k]||0)+x.qty}));const out={};(d.orders||[]).forEach(o=>(o.items||[]).forEach(raw=>{const x=latestSummaryItem(raw),k=sentKey(o.owner,x),qty=Math.max(0,x.qty-(sent[k]||0));if(!qty)return;(out[x.vendor]??=[]).push({...x,owner:o.owner,qty,amount:qty*x.price})}));return out}
function renderSummary(d){const designers=Object.entries(d.designers).map(([name,o])=>[name,{...o,items:o.items.map(latestSummaryItem)}]),designerAmount=designers.reduce((s,[,o])=>s+o.items.reduce((n,x)=>n+x.amount,0),0),vendorRows=Object.entries(d.vendors).map(([vendor,o])=>[vendor,latestVendorItems(o,vendor)]),grandAmount=vendorRows.reduce((s,[,items])=>s+items.reduce((n,x)=>n+x.amount,0),0),shopAmount=Math.max(0,grandAmount-designerAmount),pending=pendingByVendor(d);designerTotal.textContent=money(designerAmount);shopTotal.textContent=money(shopAmount);grandTotal.textContent=money(grandAmount);designerList.innerHTML=designers.length?designers.map(([name,o])=>{const amount=o.items.reduce((s,x)=>s+x.amount,0);return `<div class="order-block"><h3>${esc(name)} <span class="badge">${money(amount)}</span></h3><div class="muted">最後更新 ${esc(o.updatedAt)}</div>${o.items.map(x=>`<div class="line"><span>${esc(x.vendor)}｜${esc(x.name)} ${esc(x.spec||'')}</span><span>${x.qty} × ${money(x.price)} = <b>${money(x.amount)}</b></span></div>`).join('')}<button class="danger" onclick="deleteDesigner('${encodeURIComponent(name)}')">刪除此人貨單</button></div>`}).join(''):'本月尚無設計師貨單';vendorCopyTexts={};vendorCopyPayloads={};Object.entries(pending).forEach(([vendor,items])=>{vendorCopyPayloads[vendor]=items;const merged={};items.forEach(x=>{const k=[x.name,x.spec].join('|');if(!merged[k])merged[k]={...x,qty:0};merged[k].qty+=x.qty});vendorCopyTexts[vendor]=`【${d.month} W.D 追加叫貨單】\n廠商：${vendor}\n`+Object.values(merged).map(x=>`${x.name} ${x.spec||''}：${x.qty}`).join('\n')});vendorCopyButtons.innerHTML=vendorRows.map(([vendor])=>{const qty=(pending[vendor]||[]).reduce((s,x)=>s+x.qty,0);return qty?`<button onclick="copyVendorSummary('${encodeURIComponent(vendor)}')">複製並標記送出 ${esc(vendor)}（${qty}）</button>`:`<button disabled>${esc(vendor)}｜目前無待送追加</button>`}).join('')||'<span class="muted">本月尚無廠商資料</span>';window.sentBatchMap={};(d.sentBatches||[]).forEach(b=>window.sentBatchMap[b.batchId]=b);sentHistory.innerHTML=(d.sentBatches||[]).length?[...d.sentBatches].reverse().map((b,i)=>`<div class="order-block"><h3>第 ${(d.sentBatches||[]).length-i} 批｜${esc(b.vendor)}</h3><div class="muted">送出時間：${esc(b.sentAt)}｜批次編號：${esc(b.batchId)}</div>${(b.items||[]).map(x=>`<div class="line"><span>${esc(x.owner)}｜${esc(x.name)} ${esc(x.spec||'')}</span><b>${x.qty}</b></div>`).join('')}<div class="row"><button onclick="editSentBatch('${encodeURIComponent(b.batchId)}')">編輯這一批</button><button class="danger" onclick="deleteSentBatch('${encodeURIComponent(b.batchId)}')">刪除誤觸批次</button></div></div>`).join(''):'本月尚無送出紀錄';vendorStats.innerHTML=vendorRows.map(([vendor,items])=>{const amount=items.reduce((s,x)=>s+x.amount,0),pendingQty=(pending[vendor]||[]).reduce((s,x)=>s+x.qty,0);return `<div class="order-block"><h3>${esc(vendor)} <span class="badge">${money(amount)}</span></h3><div class="muted">待送追加數量：${pendingQty}</div>${items.map(x=>`<div class="line"><span>${esc(x.name)} ${esc(x.spec||'')}</span><span>${x.qty} × ${money(x.price)} = <b>${money(x.amount)}</b></span></div>`).join('')}</div>`}).join('')||'本月尚無資料'}
async function post(op,extra={}){const requestId=extra.requestId||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());postForm.action=API_URL;postOp.value=op;postRequestId.value=requestId;postAdminKey.value=adminKey.value;postMonth.value=monthInput.value;postDesigner.value=extra.designer||'';postItems.value=JSON.stringify(extra.items||[]);postMode.value=extra.mode||'';postBatchId.value=extra.batchId||'';postForm.submit();for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,650));const d=await jsonp({action:'operation',requestId});if(d.found){if(d.status!=='success')throw new Error(d.message);return{...d,requestId}}}throw new Error('後端未確認操作')}
async function editSentBatch(encoded){const batchId=decodeURIComponent(encoded),b=(window.sentBatchMap||{})[batchId];if(!b)return alert('找不到批次');const items=[];for(const x of b.items||[]){const answer=prompt(`${x.owner}｜${x.name} ${x.spec||''}\n請輸入這一批的正確數量；輸入 0 可移除此品項`,String(x.qty));if(answer===null)return;const qty=Number(answer);if(!Number.isFinite(qty)||qty<0)return alert('數量格式錯誤');if(qty>0)items.push({...x,qty})}if(!items.length)return alert('不能留下空批次；若是誤觸請使用「刪除誤觸批次」');try{await post('updateSentBatch',{batchId,items});await loadAll();alert('這一批的品項與數量已更新')}catch(e){alert(e.message)}}
async function deleteSentBatch(encoded){const batchId=decodeURIComponent(encoded),b=(window.sentBatchMap||{})[batchId];if(!b||!confirm(`確定刪除 ${b.sentAt} 的 ${b.vendor} 批次？\n刪除後，這批數量會重新回到待送追加。`))return;const btn=[...sentHistory.querySelectorAll('button')].find(x=>x.getAttribute('onclick')?.includes(encodeURIComponent(batchId))&&x.textContent.includes('刪除'));if(btn){btn.disabled=true;btn.textContent='刪除中…'}try{await post('deleteSentBatch',{batchId});if(summaryData){summaryData.sentBatches=(summaryData.sentBatches||[]).filter(x=>x.batchId!==batchId);renderSummary(summaryData);renderDesignerBreakdown(summaryData);renderVendorPendingBreakdown(summaryData)}flash('已刪除誤觸批次，品項已回到待送追加');setTimeout(()=>loadAll(),700)}catch(e){if(btn){btn.disabled=false;btn.textContent='刪除誤觸批次'}flash(e.message,'error')}}
async function saveShopOrder(){if(!adminKey.value)return alert('請輸入店長密碼');const items=currentShopItems();if(!items.length)return alert('請至少選擇一項店用品');try{await post('saveShopOrder',{items});alert('店用貨單已儲存');await loadAll()}catch(e){alert(e.message)}}
