<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W.D物料後台</title><style>*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;padding:15px;background:#f5f5f7}.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px}.input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:5px 0 10px}button{padding:10px 14px;border:0;border-radius:8px;background:#007aff;color:#fff;font-weight:700;margin:3px}.danger{background:#ff3b30}.green{background:#34c759}.row{display:flex;gap:8px;flex-wrap:wrap}.designer{border-top:1px solid #eee;padding:12px 0}textarea{height:360px;font-family:monospace}</style></head><body><h1>🔒 W.D物料後台</h1><div class="card"><b>店長密碼</b><input id="key" class="input" type="password" placeholder="預設 1234，請在 Code.gs 修改"><b>查看月份</b><input id="month" class="input" type="month"><div class="row"><button class="green" onclick="loadSummary()">重新整理</button><button onclick="setLock('open')">強制開放</button><button class="danger" onclick="setLock('locked')">立即截止</button><button onclick="setLock('auto')">恢復每月20日自動截止</button></div><div id="status"></div></div><div class="card"><h3>各設計師貨單</h3><div id="designers">尚未讀取</div></div><div class="card"><h3>各廠商總統計</h3><textarea id="summary" readonly></textarea><button onclick="copyText()">複製總表</button></div><form id="postForm" method="POST" target="postFrame" style="display:none"><input id="postOp" name="op"><input id="postRequestId" name="requestId"><input id="postAdminKey" name="adminKey"><input id="postDesigner" name="designer"><input id="postMonth" name="month"><input id="postMode" name="mode"></form><iframe name="postFrame" style="display:none"></iframe><script>
const API_URL="https://script.google.com/macros/s/AKfycbwj7gqYH6D18vM1bOw4CuryA0iT-Kt53fchGl4z4uzMjJBBlUVtVcLADYy0WtWFgkCY/exec";
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999),s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('連線失敗'))};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.body.appendChild(s)})}
async function init(){try{const d=await jsonp({action:'bootstrap'});document.getElementById('month').value=d.month;document.getElementById('status').textContent=d.locked?'目前：🔒 已截止':'目前：✅ 開放中'}catch(e){document.getElementById('status').textContent='連線失敗：'+e.message}}
async function loadSummary(){const key=document.getElementById('key').value,month=document.getElementById('month').value;if(!key)return alert('請輸入店長密碼');try{const d=await jsonp({action:'summary',adminKey:key,month});if(!d.ok)throw new Error(d.message);document.getElementById('status').textContent=d.locked?'目前：🔒 已截止（'+d.lockMode+'）':'目前：✅ 開放中（'+d.lockMode+'）';const entries=Object.entries(d.designers),designers=document.getElementById('designers');designers.innerHTML=entries.length?entries.map(([name,o])=>`<div class="designer"><b>${name}</b>｜最後更新 ${o.updatedAt}<button class="danger" onclick='deleteOrder(${JSON.stringify(name)})'>刪除此人本月貨單</button>${o.items.map(i=>`<div>・[${i.vendor}] ${i.name} × ${i.qty}</div>`).join('')}</div>`).join(''):'本月尚無貨單';let text=`【${d.month} 各廠商叫貨總表】\n`;Object.entries(d.vendors).forEach(([vendor,items])=>{text+=`\n廠商：${vendor}\n`;let total=0;Object.entries(items).forEach(([name,qty])=>{text+=`${name}：${qty}\n`;total+=qty});text+=`小計：${total}\n`});document.getElementById('summary').value=text}catch(e){alert(e.message)}}
async function post(op,extra={}){const requestId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),form=document.getElementById('postForm');form.setAttribute('action',API_URL);document.getElementById('postOp').value=op;document.getElementById('postRequestId').value=requestId;document.getElementById('postAdminKey').value=document.getElementById('key').value;document.getElementById('postDesigner').value=extra.designer||'';document.getElementById('postMonth').value=document.getElementById('month').value;document.getElementById('postMode').value=extra.mode||'';form.submit();for(let i=0;i<24;i++){await new Promise(r=>setTimeout(r,650));const d=await jsonp({action:'operation',requestId});if(d.found){if(d.status!=='success')throw new Error(d.message);return d}}throw new Error('後端未確認操作')}
async function deleteOrder(name){if(!document.getElementById('key').value)return alert('請輸入店長密碼');if(!confirm('確定刪除 '+name+' 的本月貨單？'))return;try{await post('deleteOrder',{designer:name});alert('已刪除');await loadSummary()}catch(e){alert(e.message)}}
async function setLock(mode){if(!document.getElementById('key').value)return alert('請輸入店長密碼');try{await post('setLock',{mode});alert('設定完成');await loadSummary()}catch(e){alert(e.message)}}
function copyText(){const t=document.getElementById('summary');navigator.clipboard?navigator.clipboard.writeText(t.value):(()=>{t.select();document.execCommand('copy')})();alert('已複製')}
init();
</script></body></html>
