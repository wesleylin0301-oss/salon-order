<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙龍叫貨管理系統 - 店長後台</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 15px; background: #f5f5f7; color: #333; }
        h1 { text-align: center; color: #2c3e50; font-size: 1.4rem; margin-bottom: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 420px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: monospace; font-size: 0.9rem; line-height: 1.4; }
        .btn-copy { width: 100%; background: #007aff; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 1rem; }
        .btn-refresh { width: 100%; background: #34c759; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🔒 店長專用 - 叫貨總統計</h1>

    <div class="card">
        <textarea id="summary-text" readonly placeholder="資料同步載入中..."></textarea>
        <button class="btn-refresh" onclick="updateSummary()">🔄 重新整理雲端叫貨數據</button>
        <button class="btn-copy" onclick="copySummary()">📋 一鍵複製總表（傳給廠商業務）</button>
    </div>

    <script>
        // ⚠️ 請把引號內改為你步驟2取得的新網址
        const API_URL = "YOUR_NEW_GOOGLE_URL";

        async function updateSummary() {
            document.getElementById('summary-text').value = "正在讀取雲端最新叫貨紀錄，請稍候...";
            
            try {
                let detailLog = "【各設計師叫貨明細（含日期時間）】\n";
                let vendorSummary = {};

                const res = await fetch(API_URL);
                const rows = await res.json();
                
                if (!rows || rows.length <= 1) {
                    document.getElementById('summary-text').value = "目前雲端尚無任何叫貨紀錄。";
                    return;
                }

                const dataRows = rows.slice(1);
                
                dataRows.forEach(r => {
                    const timeStr = r[0];
                    const designer = r[1];
                    const vendor = r[2];
                    const pName = r[3];
                    const qty = parseInt(r[4]) || 0;

                    detailLog += `📅 ${timeStr} - 👤 ${designer}: [${vendor}] ${pName} x ${qty}\n`;

                    if (!vendorSummary[vendor]) vendorSummary[vendor] = {};
                    vendorSummary[vendor][pName] = (vendorSummary[vendor][pName] || 0) + qty;
                });

                let vendorMessage = "\n===================\n【各廠商叫貨統計總清單】\n";
                Object.entries(vendorSummary).forEach(([vendor, items]) => {
                    vendorMessage += `\n🏢 廠商：${vendor}\n-------------------\n`;
                    let vTotal = 0;
                    Object.entries(items).forEach(([pName, qty]) => {
                        vendorMessage += `${pName} : ${qty}\n`;
                        vTotal += qty;
                    });
                    vendorMessage += `小計：${vTotal}\n`;
                });

                document.getElementById('summary-text').value = detailLog + vendorMessage;

            } catch (err) {
                document.getElementById('summary-text').value = "讀取失敗，請確認網路連線或 Google 部署設定。";
            }
        }

        function copySummary() {
            const textarea = document.getElementById('summary-text');
            if (!textarea.value) return;
            textarea.select();
            document.execCommand('copy');
            alert('已複製叫貨總表！可以直接貼到 LINE 發給業務。');
        }

        updateSummary();
    </script>
</body>
</html>
