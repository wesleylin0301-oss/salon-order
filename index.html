<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沙龍叫貨系統</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;padding:15px;background:#f5f5f7;color:#222}h1{text-align:center;font-size:1.4rem}.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.item{border:1px solid #eee;border-radius:9px;padding:9px;text-align:center;background:#fafafa}.controls{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}.qtybtn{width:30px;height:30px;border:0;border-radius:50%;background:#007aff;color:#fff;font-size:18px}.series{font-weight:700;border-bottom:2px solid #007aff;padding-bottom:6px;margin-bottom:10px}.input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0 10px}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 15px;box-shadow:0 -2px 10px #0002;display:flex;justify-content:space-between;align-items:center}.submit{border:0;background:#34c759;color:#fff;padding:12px 20px;border-radius:8px;font-weight:700}.notice{padding:12px;border-radius:8px;margin-bottom:12px;text-align:center;font-weight:700;background:#fff3cd}.history{border-top:1px solid #eee;padding:10px 0}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:0;border-radius:8px}.active{background:#007aff!important;color:#fff}button:disabled{background:#bbb!important}.hidden{display:none}</style>
</head>
<body>
<h1>💇‍♂️ 沙龍叫貨系統</h1>
<div id="notice" class="notice">正在連線…</div>
<div class="tabs"><button id="tab-order" class="active" onclick="showTab('order')">📝 我要叫貨</button><button id="tab-history" onclick="showTab('history')">📜 我的本月貨單</button></div>
<div class="card"><b>設計師姓名</b><input id="designer" class="input" placeholder="請輸入姓名" autocomplete="name"><button onclick="loadMyOrder()">載入我的本月貨單</button></div>
<div id="order-view">
<div class="card"><div class="series">✏️ 特殊商品</div><input id="customVendor" class="input" placeholder="廠商"><input id="customName" class="input" placeholder="商品名稱與規格"><input id="customQty" class="input" type="number" min="1" value="1"><button onclick="addCustom()">加入特殊商品</button><div id="customList"></div></div>
<div id="products"></div><div style="height:85px"></div>
</div>
<div id="history-view" class="hidden"><div class="card"><div id="history">請先輸入姓名並載入。</div></div></div>
<div class="bar"><div>總數量：<b id="total">0</b></div><button id="submit" class="submit" onclick="submitOrder()">儲存本月貨單</button></div>
<form id="postForm" method="POST" target="postFrame" class="hidden"><input name="action"><input name="requestId"><input name="designer"><input name="month"><input name="items"></form><iframe name="postFrame" class="hidden"></iframe>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwj7gqYH6D18vM1bOw4CuryA0iT-Kt53fchGl4z4uzMjJBBlUVtVcLADYy0WtWFgkCY/exec";
const groups=[
{series:"Flole 綻放系列 ($188)",items:["2NN","3NN","4NN","5NN","6NN","7NN","8NN","10NN","3MT","4MT","5MT","6MT","7MT","8MT","10MT","12MT","3NB","4NB","5NB","6NB","7NB","8NB","10NB","12NB","5GR","6GR","7GR","8GR","10GR","12GR","5CB","6CB","7CB","8CB","10CB","12CB","5PA","6PA","7PA","8PA","10PA","12PA","5LV","6LV","7LV","8LV","10LV","12LV","5PI","6PI","7PI","8PI","10PI","12PI","CLEAR","LIFT","0-RED","0-BLUE","0-VIOLET","0-YELLOW","0-GREEN"]},
{series:"Flole 露西亞系列 ($188)",items:["增量劑14","牛奶白10","星際灰7","鐵木棕3","曜石黑1","極光灰14","清水灰13","清水灰11","清水灰9","清水灰7","珍珠灰13","珍珠灰11","珍珠灰9","珍珠灰7","迷霧藍13","迷霧藍11","迷霧藍9","迷霧藍7","薄荷綠13","薄荷綠11","薄荷綠9","薄荷綠7","珊瑚粉13","珊瑚粉11","珊瑚粉9","珊瑚粉7","薰衣草13","薰衣草11","薰衣草9","薰衣草7","蜜桃桔13","蜜桃桔11","蜜桃桔9","蜜桃桔7"]},
{series:"Flole 根本系列 ($188)",items:["10MTB","M9TB","8MTB","7MTB","6MTB","5MTB","10CB","9CB","8CB","7CB","6CB","5CB","10NGB","9NGB","8NGB","7NGB","6NGB","5NGB","10BEB","9BEB","8BEB","7BEB","6BEB","5BEB","10MGB","9MGB","8MGB","7MGB","6MGB","5MGB"]},
{series:"Flole 雙氧水 ($200)",items:["3%","6%","9%","12%"]}
];
let cart={},customItems=[],month='',locked=false;
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);window[cb]=d=>{delete window[cb];s.remove();resolve(d)};const s=document.createElement('script');s.onerror=()=>{delete window[cb];s.remove();reject(new Error('連線失敗'))};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.body.appendChild(s)})}
function render(){const root=document.getElementById('products');root.innerHTML='';groups.forEach(g=>{const card=document.createElement('div');card.className='card';let h=`<div class="series">${g.series}</div><div class="grid">`;g.items.forEach(code=>{const id=g.series+'|||'+code;h+=`<div class="item"><b>${code}</b><div class="controls"><button class="qtybtn" onclick='change(${JSON.stringify(id)},-1)'>−</button><span id="q-${esc(id)}">${cart[id]||0}</span><button class="qtybtn" onclick='change(${JSON.stringify(id)},1)'>＋</button></div></div>`});h+='</div>';card.innerHTML=h;root.appendChild(card)});renderCustom();updateTotal()}
function esc(s){return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'')}
function change(id,d){if(locked)return;cart[id]=Math.max(0,(cart[id]||0)+d);document.getElementById('q-'+esc(id)).textContent=cart[id];updateTotal()}
function addCustom(){if(locked)return;const vendor=document.getElementById('customVendor').value.trim(),name=document.getElementById('customName').value.trim(),qty=Number(document.getElementById('customQty').value)||0;if(!vendor||!name||qty<1)return alert('請填完整特殊商品');customItems.push({vendor,name:'[自訂] '+name,qty});document.getElementById('customVendor').value='';document.getElementById('customName').value='';renderCustom();updateTotal()}
function renderCustom(){document.getElementById('customList').innerHTML=customItems.map((x,i)=>`<div class="history">[${x.vendor}] ${x.name} × ${x.qty} <button onclick="customItems.splice(${i},1);renderCustom();updateTotal()">刪除</button></div>`).join('')}
function updateTotal(){document.getElementById('total').textContent=Object.values(cart).reduce((a,b)=>a+b,0)+customItems.reduce((a,b)=>a+b.qty,0)}
function itemsFromCart(){const arr=[];Object.entries(cart).forEach(([id,qty])=>{if(qty>0){const [series,code]=id.split('|||');arr.push({vendor:'Flole',name:series+' - '+code,qty})}});return arr.concat(customItems)}
async function init(){try{const d=await jsonp({action:'bootstrap'});if(!d.ok)throw new Error(d.message);month=d.month;locked=d.locked;document.getElementById('notice').textContent=locked?'🔒 本月已截止，僅店長可重新開放':'✅ 本月可叫貨（'+month+'）';document.getElementById('submit').disabled=locked;render()}catch(e){document.getElementById('notice').textContent='❌ '+e.message}}
async function loadMyOrder(){const name=document.getElementById('designer').value.trim();if(!name)return alert('請輸入姓名');const d=await jsonp({action:'designerOrder',designer:name,month});if(!d.ok)return alert(d.message);cart={};customItems=[];d.items.forEach(i=>{if(String(i.name).startsWith('[自訂]'))customItems.push({vendor:i.vendor,name:i.name,qty:i.qty});else{for(const g of groups){const prefix=g.series+' - ';if(String(i.name).startsWith(prefix)){cart[g.series+'|||'+String(i.name).slice(prefix.length)]=i.qty;break}}}});render();showHistory(d.items);alert(d.items.length?'已載入本月貨單，可直接修改後重新儲存':'本月尚未叫貨')}
function showHistory(items){document.getElementById('history').innerHTML=items.length?items.map(i=>`<div class="history">[${i.vendor}] ${i.name} × ${i.qty}</div>`).join(''):'本月尚無貨單'}
async function submitOrder(){if(locked)return alert('本月已截止');const designer=document.getElementById('designer').value.trim(),items=itemsFromCart();if(!designer)return alert('請輸入姓名');if(!items.length)return alert('請至少選一項商品');const requestId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const form=document.getElementById('postForm');form.action=API_URL;form.action.value='saveOrder';form.requestId.value=requestId;form.designer.value=designer;form.month.value=month;form.items.value=JSON.stringify(items);document.getElementById('submit').disabled=true;document.getElementById('submit').textContent='儲存中…';form.submit();try{const result=await waitOperation(requestId);if(result.status!=='success')throw new Error(result.message);alert('✅ 已確認寫入 Google 試算表');await loadMyOrder()}catch(e){alert('❌ '+e.message)}finally{document.getElementById('submit').disabled=locked;document.getElementById('submit').textContent='儲存本月貨單'}}
async function waitOperation(id){for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,700));const d=await jsonp({action:'operation',requestId:id});if(d.found)return d}throw new Error('後端未確認寫入，請檢查 Apps Script 部署')}
function showTab(tab){document.getElementById('order-view').classList.toggle('hidden',tab!=='order');document.getElementById('history-view').classList.toggle('hidden',tab!=='history');document.getElementById('tab-order').classList.toggle('active',tab==='order');document.getElementById('tab-history').classList.toggle('active',tab==='history');if(tab==='history')loadMyOrder()}
init();
</script>
</body></html>
