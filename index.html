<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WD叫貨系統</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;padding:15px;background:#f5f5f7;color:#222}
h1{text-align:center;font-size:1.4rem;margin:8px 0 14px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 9px #0000000d}
.input{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin:6px 0 10px;font-size:16px}
.notice{padding:12px;border-radius:9px;margin-bottom:12px;text-align:center;font-weight:700;background:#fff3cd}
.tabs{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:0;z-index:20;background:#f5f5f7;padding:5px 0}
.tabs button{flex:1;padding:11px;border:0;border-radius:9px;background:#e5e5ea;font-weight:700}
.tabs .active{background:#007aff;color:#fff}
.series-card{background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 9px #0000000d}
.series-head{padding:14px 15px;font-weight:800;font-size:1.05rem;background:#f0f7ff;border-left:5px solid #007aff}
details.category{border-top:1px solid #eee}
details.category>summary{cursor:pointer;list-style:none;padding:13px 15px;font-weight:750;display:flex;justify-content:space-between;align-items:center;background:#fff}
details.category>summary::-webkit-details-marker{display:none}
details.category>summary::after{content:'＋';font-size:20px;color:#007aff}
details.category[open]>summary::after{content:'−'}
.category-body{padding:12px;background:#fafafa}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.item{border:1px solid #e4e4e7;border-radius:10px;padding:9px 5px;text-align:center;background:#fff;min-height:76px}
.item.selected{border-color:#007aff;background:#eef7ff}
.code{font-weight:800;word-break:break-word;font-size:.92rem}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:7px}
.qtybtn{width:30px;height:30px;border:0;border-radius:50%;background:#007aff;color:#fff;font-size:18px;line-height:1}
.qty{font-weight:800;min-width:20px}
.btn{border:0;background:#007aff;color:#fff;padding:10px 14px;border-radius:9px;font-weight:700}
.btn.secondary{background:#8e8e93}.btn.danger{background:#ff3b30}.btn.green{background:#34c759}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:130px}
.custom-row{border-top:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.custom-info{flex:1}.custom-controls{display:flex;align-items:center;gap:6px}
.history{border-top:1px solid #eee;padding:10px 0}
.meta{font-size:.88rem;color:#666;margin-bottom:10px}
.hidden{display:none!important}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:11px 15px;box-shadow:0 -2px 10px #0002;display:flex;justify-content:space-between;align-items:center;z-index:30}
.submit{border:0;background:#34c759;color:#fff;padding:12px 19px;border-radius:9px;font-weight:800}
button:disabled{background:#bbb!important}
.searchbox{position:sticky;top:58px;z-index:15;background:#f5f5f7;padding-bottom:10px}
.small{font-size:.86rem;color:#666}
.selected-panel{border:2px solid #34c759;background:#f2fff5}
.selected-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.selected-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.selected-item{border:1px solid #bfe8c8;border-radius:10px;background:#fff;padding:10px}
.selected-name{font-weight:800;font-size:.9rem;word-break:break-word}
.selected-series{font-size:.76rem;color:#666;margin-top:2px}
.search-results{border:2px solid #007aff;background:#f3f8ff}
.search-empty{text-align:center;padding:18px;color:#666}
.department{margin-bottom:16px;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #00000012;background:#fff}
details.department>summary{cursor:pointer;list-style:none;padding:16px 17px;font-weight:900;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;background:#1f2937;color:#fff}
details.department>summary::-webkit-details-marker{display:none}
details.department>summary::after{content:'＋';font-size:22px}
details.department[open]>summary::after{content:'−'}
.department-body{padding:12px;background:#eef1f5}
.department-count{font-size:.78rem;font-weight:700;opacity:.85;margin-left:auto;margin-right:12px}
.empty-department{background:#fff;border-radius:12px;padding:20px;text-align:center;color:#777}
</style>
</head>
<body>
<h1>💇‍♂️ WD叫貨系統</h1>
<div id="notice" class="notice">正在連線…</div>
<div class="tabs">
  <button id="tab-order" class="active" onclick="showTab('order')">📝 我要叫貨</button>
  <button id="tab-history" onclick="showTab('history')">📜 我的本月貨單</button>
</div>
<div class="card">
  <b>設計師姓名</b>
  <input id="designer" class="input" placeholder="請輸入姓名" autocomplete="name">
  <div class="btnrow">
    <button class="btn" onclick="loadMyOrder(false,true)">載入本月貨單並編輯</button>
    <button class="btn secondary" onclick="clearSelection()">清空目前選擇</button>
  </div>
</div>

<div id="order-view">
  <div class="card searchbox">
    <b>🔎 搜尋商品</b>
    <input id="search" class="input" placeholder="直接輸入色號或品名，例如：7MT、清水灰、雙氧" oninput="renderProducts()">
    <div class="small">輸入後會直接顯示符合商品，可立即加減數量。</div>
  </div>

  <div id="selectedPanel" class="card selected-panel hidden">
    <div class="selected-title"><h3 style="margin:0">✅ 本月已選商品</h3><span id="selectedCount" class="small"></span></div>
    <div id="selectedList" class="selected-list"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">✏️ 特殊商品</h3>
    <input id="customVendor" class="input" placeholder="廠商">
    <input id="customName" class="input" placeholder="商品名稱與規格">
    <input id="customQty" class="input" type="number" min="1" value="1">
    <button class="btn" onclick="addCustom()">加入特殊商品</button>
    <div id="customList"></div>
  </div>

  <div id="products"></div>
  <div style="height:90px"></div>
</div>

<div id="history-view" class="hidden">
  <div class="card">
    <div id="history">請先輸入姓名並載入。</div>
    <div id="history-actions" class="btnrow hidden" style="margin-top:12px">
      <button class="btn green" onclick="editLoadedOrder()">回到叫貨頁修改</button>
      <button class="btn danger" onclick="deleteMyOrder()">刪除整張本月貨單</button>
    </div>
  </div>
</div>

<div class="bar">
  <div>總數量：<b id="total">0</b></div>
  <button id="submit" class="submit" onclick="submitOrder()">儲存／更新本月貨單</button>
</div>

<form id="postForm" method="POST" target="postFrame" class="hidden">
  <input id="postOp" name="op">
  <input id="postRequestId" name="requestId">
  <input id="postDesigner" name="designer">
  <input id="postMonth" name="month">
  <input id="postItems" name="items">
</form>
<iframe name="postFrame" class="hidden"></iframe>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwj7gqYH6D18vM1bOw4CuryA0iT-Kt53fchGl4z4uzMjJBBlUVtVcLADYy0WtWFgkCY/exec";

const departments=[{"name":"染膏","icon":"🎨","defaultOpen":true,"series":[{"series":"Fiole｜根本系列","categories":[{"name":"BB","items":["10BB","5BB","6BB","7BB","8BB","9BB"]},{"name":"CB","items":["10CB","5CB","6CB","7CB","8CB","9CB"]},{"name":"GOB","items":["10GOB","5GOB","6GOB","7GOB","8GOB","9GOB"]},{"name":"MTB","items":["10MTB","5MTB","6MTB","7MTB","8MTB","9MTB"]},{"name":"NB","items":["10NB","3NB","4NB","5NB","6NB","7NB","8NB","9NB"]},{"name":"OLB","items":["10OLB","5OLB","6OLB","7OLB","8OLB","9OLB"]},{"name":"RB","items":["10RB","5RB","6RB","7RB","8RB","9RB"]},{"name":"WB","items":["10WB","5WB","6WB","7WB","8WB","9WB"]}]},{"series":"Fiole｜綻放系列","categories":[{"name":"GA","items":["10GA","12GA","4GA","5GA","6GA","7GA","8GA"]},{"name":"GB","items":["10GB","12GB","4GB","5GB","6GB","7GB","8GB"]},{"name":"GN","items":["10GN","12GN","4GN","5GN","6GN","7GN","8GN"]},{"name":"GNB","items":["10GNB","12GNB","2GNB","4GNB","5GNB","6GNB","7GNB","8GNB"]},{"name":"GP","items":["10GP","12GP","4GP","5GP","6GP","7GP","8GP"]},{"name":"GY","items":["10GY","12GY","4GY","5GY","6GY","7GY","8GY"]},{"name":"MT","items":["10MT","12MT","3MT","4MT","5MT","6MT","7MT","8MT"]},{"name":"NN","items":["10NN","2NN","3NN","4NN","5NN","6NN","7NN","8NN"]},{"name":"特殊色","items":["B10","B6","B8","BV10","BV6","BV8","C10","C8","G6","MB10","MB6","O10","O7","P10","P8","R7","RV10","RV6","RV8","V10","V6","V8","Y10","YM10","YM6","YM8","ライトナー"]}]},{"series":"Fiole｜露西亞系列","categories":[{"name":"增量劑","items":["增量劑14"]},{"name":"奶霜灰","items":["奶霜灰11","奶霜灰13","奶霜灰5","奶霜灰7","奶霜灰9"]},{"name":"宇宙紫","items":["宇宙紫5","宇宙紫6"]},{"name":"星際灰","items":["星際灰7"]},{"name":"曜石黑","items":["曜石黑1"]},{"name":"松石綠","items":["松石綠6"]},{"name":"極光灰","items":["極光灰14"]},{"name":"極光銀","items":["極光銀11","極光銀13","極光銀5","極光銀7","極光銀9"]},{"name":"水透藍","items":["水透藍7"]},{"name":"海軍藍","items":["海軍藍3","海軍藍5"]},{"name":"清水灰","items":["清水灰11","清水灰13","清水灰5","清水灰7","清水灰9"]},{"name":"潤色劑","items":["潤色劑"]},{"name":"牛奶白","items":["牛奶白10"]},{"name":"珊瑚粉","items":["珊瑚粉10","珊瑚粉6"]},{"name":"珊瑚紫","items":["珊瑚紫3","珊瑚紫5"]},{"name":"珍珠粉","items":["珍珠粉6"]},{"name":"琥珀橘","items":["琥珀橘10"]},{"name":"石榴紅","items":["石榴紅7"]},{"name":"粉蜜紫","items":["粉蜜紫14"]},{"name":"羅馬紅","items":["羅馬紅7"]},{"name":"胭脂粉","items":["胭脂粉11","胭脂粉13","胭脂粉5","胭脂粉7","胭脂粉9"]},{"name":"蜜桃粉","items":["蜜桃粉6"]},{"name":"螢光黃","items":["螢光黃11"]},{"name":"鐵木棕","items":["鐵木棕3"]},{"name":"黎米黃","items":["黎米黃11","黎米黃14","黎米黃5","黎米黃7","黎米黃8","黎米黃9"]}]},{"series":"哥德式｜喚采/喚癮 13系列","categories":[{"name":"喚采/喚癮 13系列","items":["13-COB","13-EM","13-FAP","13-GLAP","13-GLCA","13-GLVI","13-MNV","13-Nakedcoral","13-Nakedsand","13-Nakedwarm","13-SI"]}]},{"series":"哥德式｜喚采/喚癮 7系列","categories":[{"name":"喚采/喚癮 7系列","items":["7-COB","7-EM","7-FAP","7-GLAP","7-GLCA","7-GLVI","7-MNV","7-Nakedcoral","7-Nakedsand","7-Nakedwarm","7-SI"]}]},{"series":"哥德式｜喚采/喚癮 Deep/Pale","categories":[{"name":"喚采/喚癮 Deep/Pale","items":["Deep Blue","Deep Purple","Deep Silver","Pale Beige","Pale Blue","Pale Orange","Pale Pink","Pale Silver","Pale Violet","Pale Yellow"]}]},{"series":"萊肯｜重組染膏","categories":[{"name":"重組染膏","items":["萊肯重組染膏"]}]}]},{"name":"藥水","icon":"🧴","defaultOpen":false,"series":[{"series":"Fiole","categories":[{"name":"漂粉","items":["露西亞漂粉 極速｜500g"]},{"name":"其他","items":["QC｜250g"]},{"name":"植萃燙髮 2劑","items":["植萃燙髮 2劑 乳液狀｜400g","植萃燙髮 2劑 液狀｜2000ml","植萃燙髮 2劑 霜狀｜400g"]},{"name":"水光系列","items":["水光系列一劑 M1 藍｜400ml"]}]},{"series":"哥德式","categories":[{"name":"喚采雙氧水","items":["喚采雙氧水 3%｜1000ml","喚采雙氧水 6%｜1000ml","喚采雙氧水 9%｜1000ml"]},{"name":"AQ 水鑽光溫塑","items":["AQ 水鑽光溫塑 H1｜400g","AQ 水鑽光溫塑 N1｜400g","AQ 水鑽光溫塑 SH1｜400g"]},{"name":"Neo 溫塑 2劑","items":["Neo 溫塑 2劑 液狀｜800g","Neo 溫塑 2劑 霧狀｜800g"]}]}]},{"name":"洗髮/護髮","icon":"🧼","defaultOpen":false,"series":[{"series":"Fiole","categories":[{"name":"露西亞增色洗","items":["露西亞增色洗 橘｜250ml","露西亞增色洗 灰｜250ml","露西亞增色洗 粉紅｜250ml","露西亞增色洗 紫｜250ml"]}]},{"series":"哥德式 MILBON","categories":[{"name":"jemile fran","items":["jemile fran 洗髮精 S｜2500ml","jemile fran 洗髮精 S｜500ml","jemile fran 護髮 S｜2500g","jemile fran 護髮 S｜500g"]},{"name":"恆羽","items":["恆羽洗髮精 A｜1800ml","恆羽洗髮精 A｜500ml","恆羽護髮 M｜1800g","恆羽護髮 M｜500g"]},{"name":"柔漾","items":["柔漾洗髮精 SL｜1800ml","柔漾洗髮精 SL｜500ml","柔漾護髮素 WL｜1800ml","柔漾護髮素 WL｜500g"]}]}]},{"name":"護髮/造型","icon":"✨","defaultOpen":false,"series":[{"series":"哥德式","categories":[{"name":"修護果油","items":["抗曬修護果油｜120ml"]},{"name":"極度系列","items":["極度慕斯｜300ml","極度晶雕｜150ml"]},{"name":"漂後極潤","items":["漂後極潤果油 BC｜120ml","漂後極潤果露 BG｜120ml"]},{"name":"舞動造型噴霧","items":["舞動造型噴霧 塑型藍｜180g","舞動造型噴霧 柔光白｜180g","舞動造型噴霧 輕盈粉｜180g"]},{"name":"舞動髮蠟","items":["舞動髮蠟 動感黑｜80g"]}]}]},{"name":"店販商品","icon":"🛍️","defaultOpen":false,"series":[]},{"name":"其他耗材","icon":"📦","defaultOpen":false,"series":[{"series":"Fiole","categories":[{"name":"去色","items":["去色化妝水｜280ml"]},{"name":"隔離","items":["原子隔離噴霧"]}]},{"series":"LUIT","categories":[{"name":"洗髮露","items":["藜麥洗髮露｜1000ml"]}]},{"series":"艾淂","categories":[{"name":"保護膜","items":["艾淂保護膜極潤｜100g 小包"]}]}]}];

function allSeries(){return departments.flatMap(d=>d.series)}

let cart={},customItems=[],month='',locked=false,lastLoadedItems=[],lastUpdatedAt='';
const designerInput=document.getElementById('designer');
designerInput.value=localStorage.getItem('salon_designer_name')||'';
designerInput.addEventListener('input',()=>localStorage.setItem('salon_designer_name',designerInput.value.trim()));

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    const s=document.createElement('script');
    window[cb]=d=>{delete window[cb];s.remove();resolve(d)};
    s.onerror=()=>{delete window[cb];s.remove();reject(new Error('連線失敗'))};
    s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});
    document.body.appendChild(s);
  });
}

function esc(s){return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'')}
function productId(series,code){return series+'|||'+code}

function renderSelectedPanel(){
  const entries=Object.entries(cart).filter(([,qty])=>Number(qty)>0);
  const panel=document.getElementById('selectedPanel');
  const list=document.getElementById('selectedList');
  const count=document.getElementById('selectedCount');
  if(!entries.length){panel.classList.add('hidden');list.innerHTML='';count.textContent='';return}
  panel.classList.remove('hidden');
  count.textContent=`${entries.length} 個品項`;
  list.innerHTML=entries.map(([id,qty])=>{
    const [series,code]=id.split('|||');
    return `<div class="selected-item"><div class="selected-name">${code}</div><div class="selected-series">${series}</div><div class="controls"><button class="qtybtn" onclick='change(${JSON.stringify(id)},-1)'>−</button><span class="qty">${qty}</span><button class="qtybtn" onclick='change(${JSON.stringify(id)},1)'>＋</button></div></div>`;
  }).join('');
}

function renderProducts(){
  const root=document.getElementById('products');
  const keyword=document.getElementById('search').value.trim().toLowerCase();
  renderSelectedPanel();
  root.innerHTML='';

  if(keyword){
    const matches=[];
    departments.forEach(dept=>dept.series.forEach(series=>series.categories.forEach(cat=>cat.items.forEach(code=>{
      if(dept.name.toLowerCase().includes(keyword)||series.series.toLowerCase().includes(keyword)||cat.name.toLowerCase().includes(keyword)||code.toLowerCase().includes(keyword)){
        matches.push({department:dept.name,series:series.series,category:cat.name,code});
      }
    }))));
    const card=document.createElement('div');
    card.className='card search-results';
    card.innerHTML=`<h3 style="margin-top:0">搜尋結果（${matches.length}）</h3>`+
      (matches.length?`<div class="grid">${matches.map(x=>{
        const id=productId(x.series,x.code),qty=cart[id]||0;
        return `<div id="item-${esc(id)}" class="item ${qty>0?'selected':''}"><div class="code">${x.code}</div><div class="small">${x.department}｜${x.category}</div><div class="controls"><button class="qtybtn" onclick='change(${JSON.stringify(id)},-1)'>−</button><span class="qty" id="q-${esc(id)}">${qty}</span><button class="qtybtn" onclick='change(${JSON.stringify(id)},1)'>＋</button></div></div>`;
      }).join('')}</div>`:'<div class="search-empty">找不到符合的商品，請換一個關鍵字。</div>');
    root.appendChild(card);
    return;
  }

  departments.forEach((dept,deptIndex)=>{
    const deptSelected=dept.series.reduce((sum,series)=>sum+series.categories.reduce((s,cat)=>s+cat.items.filter(code=>(cart[productId(series.series,code)]||0)>0).length,0),0);
    const deptItemCount=dept.series.reduce((sum,series)=>sum+series.categories.reduce((s,cat)=>s+cat.items.length,0),0);
    const deptWrap=document.createElement('details');
    deptWrap.className='department';
    if(dept.defaultOpen||deptSelected>0)deptWrap.open=true;
    const summary=document.createElement('summary');
    summary.innerHTML=`<span>${dept.icon} ${dept.name}</span><span class="department-count">${deptSelected?`已選 ${deptSelected} 項`:`${deptItemCount} 個品項`}</span>`;
    deptWrap.appendChild(summary);
    const body=document.createElement('div');
    body.className='department-body';

    if(!dept.series.length){
      body.innerHTML='<div class="empty-department">目前尚未建立店販商品。可先使用上方「特殊商品」加入，之後再把固定品項放進此分類。</div>';
    }else{
      dept.series.forEach((series,seriesIndex)=>{
        const wrap=document.createElement('div');
        wrap.className='series-card';
        let html=`<div class="series-head">${series.series}</div>`;
        series.categories.forEach((cat,catIndex)=>{
          const selectedInCategory=cat.items.filter(code=>(cart[productId(series.series,code)]||0)>0).length;
          const shouldOpen=selectedInCategory>0;
          const badge=selectedInCategory?`<span class="small" style="color:#34c759;font-weight:800">已選 ${selectedInCategory} 項</span>`:`<span class="small">${cat.items.length} 個</span>`;
          html+=`<details class="category" ${shouldOpen?'open':''}><summary>${cat.name}${badge}</summary><div class="category-body"><div class="grid">`;
          cat.items.forEach(code=>{
            const id=productId(series.series,code),qty=cart[id]||0;
            html+=`<div id="item-${esc(id)}" class="item ${qty>0?'selected':''}"><div class="code">${code}</div><div class="controls"><button class="qtybtn" onclick='change(${JSON.stringify(id)},-1)'>−</button><span class="qty" id="q-${esc(id)}">${qty}</span><button class="qtybtn" onclick='change(${JSON.stringify(id)},1)'>＋</button></div></div>`;
          });
          html+='</div></div></details>';
        });
        wrap.innerHTML=html;
        body.appendChild(wrap);
      });
    }
    deptWrap.appendChild(body);
    root.appendChild(deptWrap);
  });
}
function change(id,delta){
  if(locked)return alert('本月已截止');
  cart[id]=Math.max(0,(cart[id]||0)+delta);
  const q=document.getElementById('q-'+esc(id));
  if(q)q.textContent=cart[id];
  const box=document.getElementById('item-'+esc(id));
  if(box)box.classList.toggle('selected',cart[id]>0);
  updateTotal();
  renderSelectedPanel();
}

function addCustom(){
  if(locked)return alert('本月已截止');
  const vendor=document.getElementById('customVendor').value.trim();
  const name=document.getElementById('customName').value.trim();
  const qty=Number(document.getElementById('customQty').value)||0;
  if(!vendor||!name||qty<1)return alert('請填完整特殊商品');
  customItems.push({vendor,name:'[自訂] '+name,qty});
  document.getElementById('customVendor').value='';
  document.getElementById('customName').value='';
  document.getElementById('customQty').value='1';
  renderCustom();updateTotal();
}

function customChange(index,delta){
  if(locked)return;
  customItems[index].qty=Math.max(0,Number(customItems[index].qty||0)+delta);
  if(customItems[index].qty===0)customItems.splice(index,1);
  renderCustom();updateTotal();
}
function removeCustom(index){if(locked)return;customItems.splice(index,1);renderCustom();updateTotal()}
function renderCustom(){
  document.getElementById('customList').innerHTML=customItems.length?customItems.map((x,i)=>`<div class="custom-row"><div class="custom-info"><b>[${x.vendor}]</b> ${x.name}</div><div class="custom-controls"><button class="qtybtn" onclick="customChange(${i},-1)">−</button><b>${x.qty}</b><button class="qtybtn" onclick="customChange(${i},1)">＋</button><button class="btn danger" onclick="removeCustom(${i})">刪除</button></div></div>`).join(''):'<div class="small" style="margin-top:10px">尚未加入特殊商品</div>';
}

function updateTotal(){
  document.getElementById('total').textContent=Object.values(cart).reduce((a,b)=>a+Number(b||0),0)+customItems.reduce((a,b)=>a+Number(b.qty||0),0);
}
function itemsFromCart(){
  const arr=[];
  Object.entries(cart).forEach(([id,qty])=>{
    if(Number(qty)>0){const [series,code]=id.split('|||');arr.push({vendor:'Flole',name:series+' - '+code,qty:Number(qty)})}
  });
  return arr.concat(customItems.map(x=>({...x,qty:Number(x.qty)})));
}

async function init(){
  try{
    const d=await jsonp({action:'bootstrap'});
    if(!d.ok)throw new Error(d.message);
    month=d.month;locked=d.locked;
    document.getElementById('notice').textContent=locked?'🔒 本月已截止，僅店長可重新開放':'✅ 本月可叫貨（'+month+'）';
    document.getElementById('submit').disabled=locked;
    renderProducts();renderCustom();
  }catch(e){document.getElementById('notice').textContent='❌ '+e.message}
}

function applyLoadedItems(items){
  cart={};customItems=[];lastUpdatedAt='';
  items.forEach(i=>{
    if(i.updatedAt&&String(i.updatedAt)>lastUpdatedAt)lastUpdatedAt=String(i.updatedAt);
    if(String(i.name).startsWith('[自訂]')){
      customItems.push({vendor:i.vendor,name:i.name,qty:Number(i.qty)||0});return;
    }
    for(const series of allSeries()){
      const prefix=series.series+' - ';
      if(String(i.name).startsWith(prefix)){
        cart[productId(series.series,String(i.name).slice(prefix.length))]=Number(i.qty)||0;
        break;
      }
    }
  });
  lastLoadedItems=items;
  renderProducts();renderCustom();updateTotal();showHistory(items);
}

async function loadMyOrder(silent=false,switchToOrder=false){
  const name=designerInput.value.trim();
  if(!name){if(!silent)alert('請輸入姓名');return false}
  localStorage.setItem('salon_designer_name',name);
  try{
    const d=await jsonp({action:'designerOrder',designer:name,month});
    if(!d.ok)throw new Error(d.message);
    applyLoadedItems(d.items||[]);
    if(switchToOrder&&d.items.length)showTab('order');
    if(!silent)alert(d.items.length?'已載入本月貨單，可直接增減後按「儲存／更新」':'本月尚未叫貨');
    return d.items.length>0;
  }catch(e){if(!silent)alert('讀取失敗：'+e.message);return false}
}

function showHistory(items){
  const history=document.getElementById('history');
  const actions=document.getElementById('history-actions');
  if(!items.length){history.innerHTML='本月尚無貨單';actions.classList.add('hidden');return}
  const meta=lastUpdatedAt?`<div class="meta">最後更新：${lastUpdatedAt}</div>`:'';
  history.innerHTML=meta+items.map(i=>`<div class="history">[${i.vendor}] ${i.name} × <b>${i.qty}</b></div>`).join('');
  actions.classList.remove('hidden');
}
function editLoadedOrder(){showTab('order');window.scrollTo({top:0,behavior:'smooth'})}
function clearSelection(){if(!confirm('確定清空目前畫面上的選擇？尚未儲存前不會影響雲端貨單。'))return;cart={};customItems=[];renderProducts();renderCustom();updateTotal()}

async function submitOperation(op,items){
  const designer=designerInput.value.trim();
  if(!designer)throw new Error('請輸入姓名');
  const requestId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
  const form=document.getElementById('postForm');
  form.setAttribute('action',API_URL);
  document.getElementById('postOp').value=op;
  document.getElementById('postRequestId').value=requestId;
  document.getElementById('postDesigner').value=designer;
  document.getElementById('postMonth').value=month;
  document.getElementById('postItems').value=JSON.stringify(items||[]);
  form.submit();
  return await waitOperation(requestId);
}

async function submitOrder(){
  if(locked)return alert('本月已截止');
  const items=itemsFromCart();
  if(!designerInput.value.trim())return alert('請輸入姓名');
  if(!items.length)return alert('目前沒有商品。要刪除整張貨單，請到「我的本月貨單」按刪除。');
  const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='儲存中…';
  try{
    const result=await submitOperation('saveOrder',items);
    if(result.status!=='success')throw new Error(result.message);
    let found=false;
    for(let i=0;i<6;i++){await sleep(600);found=await loadMyOrder(true,false);if(found)break}
    if(!found)throw new Error('已送出，但回查不到貨單，請確認新版 Code.gs 已部署');
    alert('✅ 本月貨單已儲存／更新成功');
  }catch(e){alert('❌ '+e.message)}finally{btn.disabled=locked;btn.textContent='儲存／更新本月貨單'}
}

async function deleteMyOrder(){
  if(locked)return alert('本月已截止，請由店長處理刪除');
  const name=designerInput.value.trim();
  if(!name)return alert('請輸入姓名');
  if(!lastLoadedItems.length)return alert('目前沒有可刪除的貨單');
  if(!confirm('確定要刪除 '+name+' 的整張 '+month+' 貨單？此動作無法復原。'))return;
  try{
    const result=await submitOperation('deleteOwnOrder',[]);
    if(result.status!=='success')throw new Error(result.message);
    cart={};customItems=[];lastLoadedItems=[];lastUpdatedAt='';
    renderProducts();renderCustom();updateTotal();showHistory([]);
    alert('✅ 本月貨單已刪除');
  }catch(e){alert('❌ 刪除失敗：'+e.message)}
}

async function waitOperation(id){
  for(let i=0;i<24;i++){
    await sleep(650);
    const d=await jsonp({action:'operation',requestId:id});
    if(d.found)return d;
  }
  throw new Error('後端未確認操作，請檢查 Apps Script 是否部署新版');
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function showTab(tab){
  document.getElementById('order-view').classList.toggle('hidden',tab!=='order');
  document.getElementById('history-view').classList.toggle('hidden',tab!=='history');
  document.getElementById('tab-order').classList.toggle('active',tab==='order');
  document.getElementById('tab-history').classList.toggle('active',tab==='history');
  if(tab==='history')loadMyOrder(true,false);
}
init();
</script>
</body>
</html>
